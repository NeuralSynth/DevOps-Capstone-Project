name: TaskBoard Python CI/CD
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
env:
  REGISTRY: ghcr.io
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install backend dependencies
        run: pip install -r requirements.txt
        working-directory: backend
      - name: Run backend tests
        run: pytest -q
        working-directory: backend
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Build frontend
        run: npm install && npm run build
        working-directory: frontend
  build-scan-push:
    needs: test
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}
    steps:
      - uses: actions/checkout@v4
      - name: Set lowercase image prefix
        # GHCR image names must be lowercase; the owner (e.g. NeuralSynth) may not be
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build images
        run: |
          docker build -t $IMAGE_PREFIX/taskboard-backend:${{ github.sha }} -t $IMAGE_PREFIX/taskboard-backend:latest ./backend
          docker build -t $IMAGE_PREFIX/taskboard-frontend:${{ github.sha }} -t $IMAGE_PREFIX/taskboard-frontend:latest ./frontend
      - name: Scan backend
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/taskboard-backend:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Scan frontend
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/taskboard-frontend:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Push images
        run: |
          docker push --all-tags $IMAGE_PREFIX/taskboard-backend
          docker push --all-tags $IMAGE_PREFIX/taskboard-frontend
  deploy:
    # Needs a kubeconfig that works from the runner. EKS kubeconfigs authenticate with AWS
    # credentials, so this job only runs when the KUBE_DEPLOY repository variable is 'true'.
    if: github.ref == 'refs/heads/main' && vars.KUBE_DEPLOY == 'true'
    needs: build-scan-push
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: read}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Configure kubectl
        env: {KUBE_CONFIG_DATA: '${{ secrets.KUBE_CONFIG_DATA }}'}
        run: |
          mkdir -p ~/.kube
          echo "$KUBE_CONFIG_DATA" | base64 -d > ~/.kube/config
      - name: Deploy with Helm
        run: |
          IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}
          helm upgrade --install taskboard ./helm/taskboard -n taskboard --create-namespace             --set backend.tag=${{ github.sha }}             --set frontend.tag=${{ github.sha }}             --set backend.image=$IMAGE_PREFIX/taskboard-backend             --set frontend.image=$IMAGE_PREFIX/taskboard-frontend
